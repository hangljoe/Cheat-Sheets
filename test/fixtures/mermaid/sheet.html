<section class="page" data-layout="grid" style="--fig-max: 45mm">
  <div class="card span-4"><h2><i data-icon="workflow"></i>Flow</h2>
    <figure data-mermaid style="--fig-max: 88mm"><script type="text/mermaid">
flowchart TD
  A[Working dir] -->|add| B[Staging]
  B -->|commit| C{Repo}
    </script></figure></div>
  <div class="card span-4"><h2><i data-icon="messages-square"></i>Sequence</h2>
    <figure data-mermaid="diagrams/seq.mmd"></figure></div>
  <div class="card span-4"><h2><i data-icon="boxes"></i>Class</h2>
    <figure data-mermaid><script type="text/mermaid">
classDiagram
  Animal <|-- Duck
  Animal : +int age
  Duck : +swim()
    </script></figure></div>
</section>
<section class="page" data-layout="grid" style="--fig-max: 45mm">
  <div class="card span-4"><h2><i data-icon="pie-chart"></i>Pie</h2>
    <figure data-mermaid style="--fig-max: 80mm"><script type="text/mermaid">
pie title Pets
  "Dogs" : 3
  "Cats" : 2
    </script></figure></div>
  <div class="card span-2"><h2><i data-icon="triangle-alert"></i>Broken</h2>
    <figure data-mermaid><script type="text/mermaid">this is not mermaid at all</script></figure></div>
  <div class="card span-6"><h2><i data-icon="pencil"></i>Excalidraw</h2>
    <figure data-excalidraw="diagrams/areas.excalidraw"></figure></div>
</section>
